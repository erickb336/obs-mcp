name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24]
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # The file check tests make SIMULATED media with ffmpeg. On Linux, CI installs the ffmpeg 6.1 package of the runner's
      # Ubuntu; on macOS and Windows those tests skip with the reason, and the parser tests still run.
      - name: Install ffmpeg 6.1 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends 'ffmpeg=7:6.1.*'
          ffmpeg -hide_banner -version | head -1
      - run: npm ci
      - name: Catalogue parity check
        run: npm run parity
      - name: Build and tests
        run: npm test
      - name: Packed package, started by npx, driven by an MCP client
        run: npm run smoke
